name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update changelog
        run: node .github/scripts/update-changelog.mjs

      - name: Commit changelog
        id: commit
        run: |
          if git diff --quiet CHANGELOG.md .changelog-last-commit; then
            echo "No changelog updates"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog-last-commit
          git commit -m "chore: update changelog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/arialabs/accountability-dashboard/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
