name: Vote Sync

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of vote history to sync'
        required: false
        default: '7'

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync-votes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync votes
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: pnpm votes:sync --days=$LOOKBACK_DAYS

      - name: Report sync status
        run: |
          STATUS=$(jq -r '.status' src/data/vote-sync-status.json)
          ERRORS=$(jq -r '[.errors[] | "\(.stage): \(.message)"] | join("; ")' src/data/vote-sync-status.json)
          {
            echo "## Vote sync: $STATUS"
            jq -r '"- Roll calls stored: \(.total_roll_calls_stored)\n- Member votes stored: \(.total_member_votes_stored)\n- Errors: \(.errors | length)"' src/data/vote-sync-status.json
            if [ -n "$ERRORS" ]; then echo "- Details: $ERRORS"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "partial" ]; then
            echo "::warning::Vote sync completed partially: $ERRORS"
          elif [ "$STATUS" = "error" ]; then
            echo "::error::Vote sync failed: $ERRORS"
            exit 1
          fi

      - name: Commit updated vote store
        id: commit
        run: |
          if git diff --quiet src/data/live-votes.json src/data/vote-sync-status.json; then
            echo "No vote-store changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-votes.json src/data/vote-sync-status.json
          git commit -m "chore(data): sync live vote tracking"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy with fresh data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow-name: Vote Sync
