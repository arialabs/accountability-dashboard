name: Vote Sync

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of vote history to sync'
        required: false
        default: '7'

jobs:
  sync-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync votes
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: pnpm votes:sync --days=$LOOKBACK_DAYS

      - name: Commit updated vote store
        run: |
          if git diff --quiet src/data/live-votes.json src/data/vote-sync-status.json; then
            echo "No vote-store changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/live-votes.json src/data/vote-sync-status.json
          git commit -m "chore(data): sync live vote tracking"
          git push
