name: Executive Orders Sync

on:
  schedule:
    # Daily at 3:00 AM ET (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch executive orders from Federal Register
        run: python3 scripts/fetch-executive-orders.py

      - name: Commit if changed
        id: commit
        run: |
          git add src/data/executive-orders.json
          if git diff --staged --quiet; then
            echo "No new executive orders to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COUNT=$(python3 -c "import json; d=json.load(open('src/data/executive-orders.json')); print(d['total'])")
          git commit -m "chore(data): sync executive orders — ${COUNT} total"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy with fresh data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow-name: Executive Orders Sync
