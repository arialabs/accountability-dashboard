name: Notify pipeline failure
description: >
  Opens (or comments on) a GitHub issue labeled `pipeline-failure` so data
  sync failures are visible instead of silently leaving stale data.

inputs:
  workflow-name:
    description: Human-readable name of the failing workflow
    required: true

runs:
  using: composite
  steps:
    - name: Create or update failure issue
      uses: actions/github-script@v7
      env:
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
      with:
        script: |
          const workflowName = process.env.WORKFLOW_NAME;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const title = `Pipeline failure: ${workflowName}`;

          const { data: existing } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'pipeline-failure',
            per_page: 50,
          });

          const issue = existing.find((i) => i.title === title);
          const body = [
            `**Workflow:** ${workflowName}`,
            `**Run:** ${runUrl}`,
            `**Time:** ${new Date().toISOString()}`,
            '',
            'This scheduled data pipeline failed. Until it succeeds again, the site may serve stale data for this source.',
          ].join('\n');

          if (issue) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Failed again.\n\n${body}`,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pipeline-failure'],
            });
          }
